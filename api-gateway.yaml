apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: agenda-app
data:
  CONTACT_SERVICE_HOST: "contact-service"
  CONTACT_SERVICE_PORT: "8080"
  EVENT_SERVICE_HOST: "event-service"
  EVENT_SERVICE_PORT: "8081"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: agenda-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: agenda/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: api-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: agenda-app
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: agenda-app
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8082